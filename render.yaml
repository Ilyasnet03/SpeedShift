services:
  - type: web
    name: speedshift-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: speedshift-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: speedshift-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: speedshift-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: speedshift-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: speedshift-db
          property: password
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp-relay.brevo.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://speedshift-web.onrender.com

  - type: web
    name: speedshift-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://speedshift-api.onrender.com/api

databases:
  - name: speedshift-db
    databaseName: speedshift
    user: speedshift
    plan: free
    region: frankfurt
