spring:
  application:
    name: speedshift-api
  datasource:
    url: jdbc:postgresql://localhost:5432/speedshift
    username: speedshift
    password: speedshift
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  sql:
    init:
      mode: never
  websocket:
    message-broker:
      prefix: /topic
      application-destination-prefixes: /app
server:
  port: ${PORT:8080}
jwt:
  secret: ${JWT_SECRET:speedshift-super-secret-key-should-be-changed-for-production}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
