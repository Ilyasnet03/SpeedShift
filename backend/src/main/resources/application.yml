spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  application:
    name: speedshift-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:speedshift}
    username: ${DB_USER:speedshift}
    password: ${DB_PASSWORD:speedshift}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  sql:
    init:
      mode: never
  websocket:
    message-broker:
      prefix: /topic
      application-destination-prefixes: /app
server:
  port: ${PORT:8080}
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:}
  brevo-api-key: ${BREVO_API_KEY:}
jwt:
  secret: ${JWT_SECRET:speedshift-super-secret-key-should-be-changed-for-production}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
