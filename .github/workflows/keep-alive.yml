name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (Render free tier sleeps after 15 min of inactivity)
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://speedshift-api.onrender.com/api/ping
