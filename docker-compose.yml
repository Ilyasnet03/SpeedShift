version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: speedshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speedshift}
      POSTGRES_USER: ${POSTGRES_USER:-speedshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speedshift}
    ports:
      - "5432:5432"
    volumes:
      - speedshift_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: speedshift-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: speedshift-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/speedshift}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-speedshift}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-speedshift}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: speedshift-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      BACKEND_INTERNAL_HOSTPORT: backend:8080

volumes:
  speedshift_pg:
